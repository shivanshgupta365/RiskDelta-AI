name: release-vm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Prepare env
        run: cp .env.example .env

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}/web
            ghcr.io/${{ github.repository }}/api
            ghcr.io/${{ github.repository }}/worker
          tags: |
            type=ref,event=tag
            type=sha

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/web:${{ github.ref_name }}

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/api:${{ github.ref_name }}

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/worker:${{ github.ref_name }}

  deploy:
    needs: build-and-publish
    runs-on: ubuntu-latest
    env:
      VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
      VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
      VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
      VM_DEPLOY_PATH: ${{ secrets.VM_DEPLOY_PATH }}
    steps:
      - name: Check deployment configuration
        id: deployment-config
        shell: bash
        run: |
          if [[ -n "$VM_SSH_HOST" && -n "$VM_SSH_USER" && -n "$VM_SSH_PRIVATE_KEY" && -n "$VM_DEPLOY_PATH" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "VM deployment secrets are not configured; skipping deploy."
          fi

      - name: Deploy to VM
        if: steps.deployment-config.outputs.enabled == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.VM_SSH_HOST }}
          username: ${{ env.VM_SSH_USER }}
          key: ${{ env.VM_SSH_PRIVATE_KEY }}
          script: |
            cd ${{ env.VM_DEPLOY_PATH }}
            git fetch --tags origin
            git checkout ${{ github.ref_name }}
            docker compose -f docker-compose.prod.yml pull
            ./scripts/release-vm.sh
